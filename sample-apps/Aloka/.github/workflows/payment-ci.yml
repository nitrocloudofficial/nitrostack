name: Payment Service CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test-payment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install payment service dependencies
        working-directory: ./services-code/payment
        run: npm install

      - name: Run payment service charge test
        working-directory: ./services-code/payment
        run: node -e "require('./charge').charge({ creditCard: { creditCardNumber: '4111111111111111' } })"

      - name: Trigger OmniTrace Webhook on Failure
        if: failure()
        run: |
          curl -X POST https://your-webhook-url/webhooks/github \
            -H "Content-Type: application/json" \
            -d '{
              "repository_url": "https://github.com/${{ github.repository }}",
              "branch_name": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}",
              "failing_job_id": "${{ github.run_id }}",
              "run_id": "${{ github.run_id }}",
              "owner": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}"
            }'
