# PassportIQ — CI, and the gate in front of a NitroCloud deploy.
#
# NitroCloud deploys from git on push, so this workflow's job is to make a broken
# push visible BEFORE the platform builds it. Everything here mirrors what the
# Dockerfile does, in the same order, for the same reasons.
name: CI / NitroCloud

on:
  push:
    branches: [main, genspark_ai_developer]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install server dependencies
        run: npm ci --no-audit --no-fund

      # src/widgets is a SEPARATE npm project. The widget bundler resolves React
      # from src/widgets/node_modules; skip this and every bundle ships without
      # React and renders an empty frame.
      - name: Install widget dependencies
        run: npm --prefix src/widgets ci --no-audit --no-fund

      - name: Typecheck server and widgets
        run: npm run typecheck:all

      - name: Build (widget bundles + dist)
        run: npm run build

      # Assert the five bundles actually landed FLAT in src/widgets/out/.
      # Component.compile() reads out/<id>.html; a nested out/<route>/index.html
      # passes boot validation and is then ignored at serve time, which shows up
      # as a blank widget rather than an error.
      - name: Assert widget bundles exist
        run: |
          for r in officer-dashboard graph-view risk-explanation agent-console console; do
            test -s "src/widgets/out/$r.html" || { echo "::error::missing bundle $r.html"; exit 1; }
            echo "ok  $r.html  $(stat -c%s "src/widgets/out/$r.html") bytes"
          done

      # Autopilot off in CI: a background sweep racing the assertions makes
      # failures non-deterministic.
      - name: Acceptance suite
        run: npm run test:all
        env:
          NODE_ENV: test
          PASSPORTIQ_AUTOPILOT: 'false'

      - name: Boot smoke test
        run: |
          NODE_ENV=production HOST=0.0.0.0 PORT=8080 PASSPORTIQ_AUTOPILOT=false \
            node dist/index.js > /tmp/boot.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/console/health > /tmp/health.json; then
              echo "--- health"; cat /tmp/health.json; echo
              node -e "
                const h = require('/tmp/health.json');
                if (!h.ok) { console.error('health not ok'); process.exit(1); }
                if (h.toolsRegistered < 45) { console.error('expected >=45 tools, got ' + h.toolsRegistered); process.exit(1); }
                console.log('✓ ' + h.toolsRegistered + ' tools registered');
              "
              curl -sf -o /dev/null -w '✓ /console %{http_code} (%{size_download} bytes)\n' http://127.0.0.1:8080/console
              exit 0
            fi
            sleep 2
          done
          echo "::error::server never became healthy"; cat /tmp/boot.log; exit 1

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only. NitroCloud does its own build from the same Dockerfile; this
      # just proves the file is valid before the platform tries.
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: passportiq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image and probe it
        run: |
          docker run -d --name piq -p 8080:8080 \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=8080 \
            -e PASSPORTIQ_AUTOPILOT=false passportiq:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/console/health >/dev/null; then
              echo "✓ container healthy"
              curl -sf -o /dev/null -w '✓ /console %{http_code}\n' http://127.0.0.1:8080/console
              docker rm -f piq; exit 0
            fi
            sleep 2
          done
          echo "::error::container never became healthy"; docker logs piq; exit 1
