version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: afo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: afo
      POSTGRES_DB: afo
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - afo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: afo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - afo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  afo-postgres-data:
    driver: local
  afo-redis-data:
    driver: local
