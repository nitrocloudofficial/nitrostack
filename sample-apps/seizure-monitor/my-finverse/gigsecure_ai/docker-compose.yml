version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gigsecure_postgres
    environment:
      POSTGRES_DB: gigsecure_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gigsecure_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gigsecure_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres_password_2026@postgres:5432/gigsecure_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: gigsecure_super_secret_jwt_key_2026_production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: gigsecure_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
