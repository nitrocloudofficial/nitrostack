name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run conformance
      # Fails only on critical production advisories. A known high zod advisory has no fix yet; see docs/THREAT_MODEL.md.
      - run: npm audit --omit=dev --audit-level=critical

  # Load and resilience run (scripts/load.mjs): offline, one server on a free port, about 4 minutes. Pushes to main only.
  # The veraPDF test needs docker plus the image verapdf/cli, which this runner does not pull, so it skips with a message.
  load:
    # Informational: timing checks depend on runner speed (two near-limit-archive checks failed on a loaded host); results are in docs/EVAL_RESULTS.md section 6.
    continue-on-error: true
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run load -- --seconds 10

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
