<script type="text/babel" data-presets="react">
const { useState, useRef, useCallback, useEffect } = React;

/* ---------- Helpers ---------- */

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

/* ---------- Backend client (Phase 2.5) ---------- */
// Served from the same origin as the API (medagent.api.server), so paths
// are relative and no CORS is involved. Every call funnels through
// request() so the backend's structured error bodies -- which carry the
// reason a clinical gate refused something -- reach the UI intact rather
// than being flattened into "request failed".

const API_BASE = "/api";

class ApiError extends Error {
  constructor(status, body) {
    super((body && (body.detail || body.error)) || `Request failed (${status})`);
    this.status = status;
    this.body = body || {};
    this.kind = (body && body.error) || "error";
  }
}

async function request(path, options = {}) {
  let response;
  try {
    response = await fetch(`${API_BASE}${path}`, options);
  } catch (networkErr) {
    // Distinguished from an HTTP error on purpose: this is the
    // "backend isn't running" case, and saying so is more useful than
    // reporting a generic failure.
    throw new ApiError(0, {
      error: "offline",
      detail: "Cannot reach the backend. Start it with:  uvicorn medagent.api.server:app",
    });
  }
  const text = await response.text();
  let body = null;
  if (text) { try { body = JSON.parse(text); } catch (_) { body = { detail: text.slice(0, 300) }; } }
  if (!response.ok) throw new ApiError(response.status, body);
  return body;
}

const api = {
  health: () => request("/health"),
  permissions: () => request("/auth/permissions"),
  listCases: () => request("/cases"),
  getCase: (caseId) => request(`/cases/${encodeURIComponent(caseId)}`),
  submitCase: (file, caseId, patientMetadata, submittedBy) => {
    const form = new FormData();
    form.append("image", file);
    form.append("case_id", caseId);
    form.append("patient_metadata", JSON.stringify(patientMetadata));
    if (submittedBy) form.append("submitted_by", submittedBy);
    return request("/cases", { method: "POST", body: form });
  },
  review: (caseId, payload) =>
    request(`/cases/${encodeURIComponent(caseId)}/review`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }),
  audit: (caseId) => request(`/audit${caseId ? `?case_id=${encodeURIComponent(caseId)}` : ""}`),
  assetUrl: (caseId, kind) => `${API_BASE}/cases/${encodeURIComponent(caseId)}/assets/${kind}`,
};

/* ---------- Session ---------- */
// The role is asserted by the operator, not authenticated. The backend
// enforces what a role may DO, but neither end verifies who the person
// is. That gap is real and tracked in REG-002 section 6.2 -- the sign-in
// screen states it plainly rather than implying a login occurred.
const SESSION_KEY = "medagent-session";

const loadSession = () => {
  try { return JSON.parse(window.localStorage.getItem(SESSION_KEY) || "null"); }
  catch (_) { return null; }
};
const saveSession = (user) => {
  try {
    if (user) window.localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    else window.localStorage.removeItem(SESSION_KEY);
  } catch (_) { /* private browsing -- the session simply won't persist */ }
};

const ROLE_LABELS = { radiologist: "Attending Radiologist", admin: "System Administrator" };
const initialsOf = (userId) =>
  (userId || "?").split(/[.\-_@\s]+/).filter(Boolean).slice(0, 2)
    .map((p) => p[0].toUpperCase()).join("") || "?";

/* ---------- Upload error messages ---------- */
// Turns a backend failure into something a clinician can act on. Every
// branch here answers "what do I do next?" -- an error toast that only
// restates the status code sends the reader to the browser console,
// which on a clinical workstation means it gets ignored.
function describeUploadError(err) {
  if (err.status === 0) {
    return { title: "Backend unreachable", body: err.message };
  }
  if (err.kind === "deidentification_failed") {
    return {
      title: "Halted: de-identification failed",
      body: "This study was stopped before analysis because its PHI could not be safely removed. Nothing was retained. " + err.message,
    };
  }
  if (err.status === 422 || err.status === 400) {
    return {
      title: "Study details need correcting",
      body: err.message.replace(/^patient_metadata (failed validation -- |is not valid JSON: |must be )/, "") ||
        "The submitted patient details were rejected.",
    };
  }
  if (err.status === 403 || err.status === 401) {
    return { title: "Not permitted", body: err.message };
  }
  if (err.status === 503) {
    return {
      title: "Knowledge base unavailable",
      body: "The guideline index failed signature verification, so retrieval is refusing to run. " + err.message,
    };
  }
  if (err.status >= 500) {
    return {
      title: "Server error during processing",
      body: `${err.message} — the case was not created. Check the backend log for the full trace.`,
    };
  }
  return { title: "Submission failed", body: err.message };
}

/* ---------- Patient metadata ---------- */
// The backend requires a complete, well-typed PatientMetadata. Wiping the
// mock case left these fields blank, so an upload submitted patient_id:""
// and the request failed validation. Rather than block a test upload
// behind a data-entry form, missing fields are completed here and the
// completed values are written back to the panel -- what the console
// displays and what the backend received must be the same thing, or the
// operator is reading metadata that no case actually has.
const AUTO_ID_PREFIX = "P-AUTO-";
const isAutoAssigned = (patientId) => String(patientId || "").startsWith(AUTO_ID_PREFIX);

function completePatientMetadata(meta) {
  const trimmed = (v) => String(v == null ? "" : v).trim();

  const patientId = trimmed(meta.patientId)
    || `${AUTO_ID_PREFIX}${Math.random().toString(36).slice(2, 6).toUpperCase()}`;

  const parsedAge = parseInt(trimmed(meta.age), 10);
  const age = Number.isFinite(parsedAge) && parsedAge >= 0 && parsedAge <= 120 ? parsedAge : 50;

  const sexChar = trimmed(meta.sex).charAt(0).toUpperCase();
  const sex = ["M", "F", "O"].includes(sexChar) ? sexChar : "F";

  const viewRaw = trimmed(meta.viewPosition).slice(0, 2).toUpperCase();
  const viewPosition = ["PA", "AP"].includes(viewRaw) ? viewRaw : "PA";

  return {
    // What the API receives -- matches PatientMetadataPayload exactly.
    payload: { age, sex, view_position: viewPosition, patient_id: patientId },
    // What the panel should now show, so the two cannot disagree.
    display: {
      ...meta,
      patientId,
      age: String(age),
      sex,
      viewPosition,
    },
    autoAssigned: !trimmed(meta.patientId),
  };
}

const SEVERITY_RANK = { high: 3, moderate: 2, low: 1 };
const SEVERITY_DOT = { high: "bg-crimson-500", moderate: "bg-amber-500", low: "bg-sage-500" };
const SEVERITY_TEXT = { high: "text-crimson-600", moderate: "text-amber-700", low: "text-sage-600" };

/* ---------- Persistence ---------- */
// Keyed by the backend's real case_id. There is no fixed demo key any
// more: a console that persists one hardcoded case is a console that
// can silently show you yesterday's patient.
const caseStorageKey = (caseId) => `medagent-case-${caseId}`;

// Empty until a study is uploaded and the backend returns a real case.
// The console deliberately renders nothing clinical before that -- a
// placeholder finding on a diagnostic screen is indistinguishable from
// a real one at a glance, which is exactly the confusion that made the
// previous build unsafe to demo.
const EMPTY_PATIENT_META = {
  caseId: "", patientId: "", age: "", sex: "", viewPosition: "",
};

/* ---------- Multi-agent pipeline ---------- */

const PIPELINE_STEPS = [
  { key: "diagnosis", label: "Diagnosis Agent", detail: "Analyzing radiograph for abnormal patterns" },
  { key: "evidence", label: "Evidence Agent", detail: "Retrieving ATS/IDSA guidelines from the signed index" },
  { key: "report", label: "Report Agent", detail: "Drafting structured radiology report" },
  { key: "verifier", label: "Verifier Agent", detail: "Deterministic checks: schema, detector agreement, citation grounding" },
];

/* ---------- Backend payload -> view model ---------- */
// The canvas SVG is a 400x480 viewBox; the backend emits detections in
// normalized [0,1] image coordinates, so everything scales through here.
const CANVAS_W = 400;
const CANVAS_H = 480;

// The vision layer reports per-detection confidence but no severity --
// severity is the Diagnosis Agent's categorical clinical judgement,
// carried on diagnosis_findings and applied to the whole case. Deriving
// a per-box "severity" from the detector score would be inventing a
// clinical assessment the model never made.
function deriveFindings(apiCase) {
  if (!apiCase || !Array.isArray(apiCase.detections)) return [];
  const dx = apiCase.diagnosis_findings || {};
  const severity = ["high", "moderate", "low"].includes(dx.severity) ? dx.severity : "moderate";

  return apiCase.detections.map((d, i) => {
    const x = clamp(d.x_min, 0, 1) * CANVAS_W;
    const y = clamp(d.y_min, 0, 1) * CANVAS_H;
    const w = Math.max(0, (clamp(d.x_max, 0, 1) - clamp(d.x_min, 0, 1))) * CANVAS_W;
    const h = Math.max(0, (clamp(d.y_max, 0, 1) - clamp(d.y_min, 0, 1))) * CANVAS_H;
    return {
      id: `det-${i}`,
      label: dx.finding_label && i === 0 ? dx.finding_label : (d.label || "Detection"),
      region: dx.anatomical_region || "region not specified",
      confidence: Math.round((d.score || 0) * 100),
      severity,
      box: { x, y, w, h },
      heat: { cx: x + w / 2, cy: y + h / 2, r: Math.max(18, Math.min(w, h) / 2) },
      score: d.score,
      rawLabel: d.label,
    };
  });
}

// retrieved_evidence arrives as one pre-formatted string of
// "[n] Source: <name>\n<body>" blocks (evidence_agent.py). Parsing it
// back into records here keeps the citation numbers the Verifier
// grounds against visible next to the text they refer to.
function parseEvidence(retrievedEvidence) {
  if (!retrievedEvidence || typeof retrievedEvidence !== "string") return [];
  const blocks = retrievedEvidence.split(/\n\s*\n/).filter((b) => b.trim());
  return blocks.map((block, i) => {
    const match = block.match(/^\s*\[(\d+)\]\s*Source:\s*([^\n]*)\n?([\s\S]*)$/);
    if (!match) return { index: i + 1, source: "Retrieved evidence", text: block.trim() };
    return { index: parseInt(match[1], 10), source: (match[2] || "Unknown").trim(), text: (match[3] || "").trim() };
  });
}

// Pipeline status derived from what the backend actually produced,
// rather than animated on a timer. The previous build ran a fixed
// ~900ms-per-step animation that had no relationship to the real run --
// which is why the Verifier could sit spinning forever while the case
// had in fact already completed.
function deriveStepStatuses(apiCase, inFlight) {
  if (inFlight) return PIPELINE_STEPS.map(() => "active");
  if (!apiCase) return PIPELINE_STEPS.map(() => "pending");
  const dx = apiCase.diagnosis_findings;
  return [
    dx ? "done" : "pending",
    apiCase.retrieved_evidence ? "done" : "pending",
    apiCase.draft_report ? "done" : "pending",
    // The Verifier has run iff it recorded a verdict. "flagged" is a
    // completed verdict, not an unfinished one -- treating it as
    // incomplete is what left the spinner running on flagged cases.
    ["passed", "flagged"].includes(apiCase.verification_status) ? "done" : "pending",
  ];
}

function ProgressRing({ value, label, tone = "amber" }) {
  const radius = 42;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (clamp(value, 0, 100) / 100) * circumference;
  const strokeColor = tone === "amber" ? "#C7823F" : "#5C7A5E";
  const trackColor = tone === "amber" ? "#F3E1C4" : "#DCE5DC";

  return (
    <div className="flex flex-col items-center gap-2">
      <div className="relative w-28 h-28">
        <svg className="w-28 h-28 -rotate-90" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r={radius} fill="none" stroke={trackColor} strokeWidth="9" />
          <circle
            cx="50" cy="50" r={radius} fill="none"
            stroke={strokeColor} strokeWidth="9" strokeLinecap="round"
            strokeDasharray={circumference}
            strokeDashoffset={offset}
            style={{ transition: "stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1)" }}
          />
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <span className="font-serif text-2xl font-semibold text-slate-850">{Math.round(value)}%</span>
        </div>
      </div>
      <span className="text-xs font-medium tracking-wide text-slate-750/70 uppercase text-center">{label}</span>
    </div>
  );
}

function Toast({ toast }) {
  if (!toast) return null;
  const palette = {
    success: { bg: "bg-sage-600", ring: "ring-sage-500/30" },
    neutral: { bg: "bg-slate-750", ring: "ring-slate-750/30" },
    danger:  { bg: "bg-crimson-600", ring: "ring-crimson-500/30" },
  }[toast.tone];

  return (
    <div className="fixed bottom-24 right-6 z-50 toast-enter">
      <div className={`${palette.bg} text-cream-50 px-5 py-3.5 rounded-xl shadow-floating ring-4 ${palette.ring} max-w-sm`}>
        <p className="text-sm font-semibold leading-snug">{toast.title}</p>
        {toast.body && <p className="text-xs text-cream-50/80 mt-0.5 leading-snug">{toast.body}</p>}
      </div>
    </div>
  );
}

function ConfirmModal({ pendingAction, onConfirm, onCancel }) {
  const confirmBtnRef = useRef(null);

  useEffect(() => {
    if (!pendingAction) return;
    if (confirmBtnRef.current) confirmBtnRef.current.focus();
    const handleKey = (e) => { if (e.key === "Escape") onCancel(); };
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, [pendingAction, onCancel]);

  if (!pendingAction) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 px-4" onClick={onCancel} role="presentation">
      <div role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title"
        className="bg-cream-50 rounded-2xl shadow-floating border border-amber-100 max-w-sm w-full p-5"
        onClick={(e) => e.stopPropagation()}>
        <h3 id="confirm-modal-title" className="font-serif text-lg font-semibold text-slate-850 mb-2">
          Approve &amp; finalize this case?
        </h3>
        <p className="text-sm text-slate-750/75 leading-relaxed mb-5">
          This signs the report as final and commits it to the local case record. You can still edit the draft afterward, but the case will be marked Finalized.
        </p>
        <div className="flex justify-end gap-2">
          <button onClick={onCancel}
            className="px-4 py-2 rounded-lg text-sm font-semibold bg-cream-100 text-slate-750 border border-amber-100 hover:bg-amber-50 transition-colors">
            Keep Reviewing
          </button>
          <button ref={confirmBtnRef} onClick={onConfirm}
            className="px-4 py-2 rounded-lg text-sm font-semibold text-cream-50 shadow-sm transition-colors bg-sage-500 hover:bg-sage-600">
            Approve &amp; Finalize
          </button>
        </div>
      </div>
    </div>
  );
}

const FEEDBACK_CONFIG = {
  reject: {
    title: "Why is this being rejected?",
    subtitle: "Sent to the backend orchestrator so it can log the feedback and route this case for secondary review.",
    placeholder: "e.g. Missed a small apical nodule; the bounding box location looks off; disagree with the severity rating…",
    submitLabel: "Submit & Archive Case",
    submitClass: "bg-crimson-500 hover:bg-crimson-600",
  },
  revise: {
    title: "What did the AI miss or get wrong?",
    subtitle: "Sent back to the Report Agent, which will attempt a revision and re-run verification.",
    placeholder: "e.g. Please note the borderline cardiomegaly more prominently; soften the certainty of the pneumonia impression…",
    submitLabel: "Send to Report Agent",
    submitClass: "bg-amber-500 hover:bg-amber-600",
  },
};

function FeedbackModal({ requestType, value, onChange, onSubmit, onCancel }) {
  const textareaRef = useRef(null);
  const [touched, setTouched] = useState(false);

  useEffect(() => {
    if (!requestType) { setTouched(false); return; }
    if (textareaRef.current) textareaRef.current.focus();
    const handleKey = (e) => { if (e.key === "Escape") onCancel(); };
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, [requestType, onCancel]);

  if (!requestType) return null;
  const config = FEEDBACK_CONFIG[requestType];
  const trimmed = value.trim();
  const isEmpty = trimmed.length === 0;

  const handleSubmit = () => {
    if (isEmpty) { setTouched(true); return; }
    onSubmit(trimmed);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 px-4" onClick={onCancel} role="presentation">
      <div role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title"
        className="bg-cream-50 rounded-2xl shadow-floating border border-amber-100 max-w-md w-full p-5"
        onClick={(e) => e.stopPropagation()}>
        <h3 id="feedback-modal-title" className="font-serif text-lg font-semibold text-slate-850 mb-1.5">
          {config.title}
        </h3>
        <p className="text-xs text-slate-750/60 leading-relaxed mb-4">{config.subtitle}</p>
        <textarea
          ref={textareaRef}
          value={value}
          onChange={(e) => onChange(e.target.value)}
          onBlur={() => setTouched(true)}
          placeholder={config.placeholder}
          rows={4}
          className={`w-full bg-cream-100/60 border rounded-xl px-3.5 py-3 text-sm leading-relaxed text-slate-850 focus:ring-2 focus:ring-amber-300 resize-none
            ${touched && isEmpty ? "border-crimson-500/50" : "border-amber-100 focus:border-amber-300"}`}
        />
        {touched && isEmpty && (
          <p className="text-xs text-crimson-600 mt-1.5">Please describe your feedback before submitting.</p>
        )}
        <div className="flex justify-end gap-2 mt-4">
          <button onClick={onCancel}
            className="px-4 py-2 rounded-lg text-sm font-semibold bg-cream-100 text-slate-750 border border-amber-100 hover:bg-amber-50 transition-colors">
            Cancel
          </button>
          <button onClick={handleSubmit}
            disabled={isEmpty}
            className={`px-4 py-2 rounded-lg text-sm font-semibold text-cream-50 shadow-sm transition-colors ${config.submitClass} ${isEmpty ? "opacity-50 cursor-not-allowed" : ""}`}>
            {config.submitLabel}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Sign-in gate (RBAC) ---------- */

function SignInGate({ onSignIn }) {
  const [userId, setUserId] = useState("");
  const [role, setRole] = useState("radiologist");
  const [matrix, setMatrix] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);

  // The permission table is fetched, never hardcoded here: it is
  // generated from the same security/auth.py the server enforces, so
  // what this screen promises and what the backend allows cannot drift.
  useEffect(() => {
    api.permissions()
      .then((data) => { setMatrix(data.matrix); setError(null); })
      .catch((err) => setError(err.message));
  }, []);

  const submit = (e) => {
    e.preventDefault();
    if (!userId.trim()) { setError("Enter a user ID."); return; }
    setBusy(true);
    const user = { user_id: userId.trim(), role };
    saveSession(user);
    onSignIn(user);
  };

  const permitted = matrix ? (matrix[role] || []) : null;

  return (
    <div className="min-h-screen bg-cream-100 text-slate-750 flex items-center justify-center px-6 py-12">
      <div className="w-full max-w-md">
        <div className="flex items-center gap-3 mb-6">
          <div className="w-10 h-10 rounded-lg bg-slate-850 flex items-center justify-center shrink-0">
            <span className="text-amber-300 font-serif font-semibold text-lg">Rx</span>
          </div>
          <div className="leading-tight">
            <h1 className="font-serif text-xl font-semibold text-slate-850 tracking-tight">Radiograph Review Console</h1>
            <p className="text-[11px] text-slate-750/60 font-medium tracking-wide uppercase">Diagnostic Imaging · Decision Support</p>
          </div>
        </div>

        <form onSubmit={submit} className="bg-cream-50 rounded-2xl shadow-card border border-amber-100 p-6">
          <h2 className="font-serif text-lg font-semibold text-slate-850 mb-1">Sign in to review</h2>
          <p className="text-xs text-slate-750/60 mb-5">
            Clinical review is role-restricted. Your role determines which decisions you may record.
          </p>

          <label className="block text-xs font-semibold uppercase tracking-wide text-slate-750/60 mb-1.5" htmlFor="signin-user">
            User ID
          </label>
          <input
            id="signin-user"
            value={userId}
            onChange={(e) => setUserId(e.target.value)}
            placeholder="e.g. r.chen"
            autoFocus
            className="w-full bg-cream-100 border border-amber-100 rounded-lg px-3 py-2 text-sm text-slate-850 mb-4 focus:outline-none focus:border-amber-500"
          />

          <span className="block text-xs font-semibold uppercase tracking-wide text-slate-750/60 mb-1.5">Role</span>
          <div className="grid grid-cols-2 gap-2 mb-4">
            {["radiologist", "admin"].map((r) => (
              <button
                key={r}
                type="button"
                onClick={() => setRole(r)}
                aria-pressed={role === r}
                className={`text-left px-3 py-2.5 rounded-lg border text-sm transition ${
                  role === r
                    ? "bg-amber-50 border-amber-500 text-slate-850"
                    : "bg-cream-100 border-amber-100 text-slate-750/70 hover:border-amber-300"
                }`}
              >
                <span className="block font-semibold capitalize">{r}</span>
                <span className="block text-[11px] opacity-70">{ROLE_LABELS[r]}</span>
              </button>
            ))}
          </div>

          {permitted && (
            <div className="bg-cream-100 border border-amber-100 rounded-lg px-3 py-2.5 mb-4">
              <p className="text-[11px] font-semibold uppercase tracking-wide text-slate-750/60 mb-1.5">
                Permitted decisions
              </p>
              <div className="flex flex-wrap gap-1.5">
                {["approve", "revise", "reject"].map((action) => {
                  const allowed = permitted.includes(action);
                  return (
                    <span key={action}
                      className={`px-2 py-0.5 rounded-full text-[11px] font-semibold border ${
                        allowed
                          ? "bg-sage-500/10 text-sage-600 border-sage-500/25"
                          : "bg-slate-850/5 text-slate-750/40 border-slate-850/10 line-through"
                      }`}>
                      {action}
                    </span>
                  );
                })}
              </div>
              {role === "admin" && (
                <p className="text-[11px] text-slate-750/60 mt-2 leading-snug">
                  Approving or revising a report is a licensed clinical act, restricted to radiologists.
                  An administrator may reject a draft, which routes the case to manual radiologist workup.
                </p>
              )}
            </div>
          )}

          {error && (
            <p className="text-xs text-crimson-600 mb-3" role="alert">{error}</p>
          )}

          <button type="submit" disabled={busy}
            className="w-full bg-slate-850 hover:bg-slate-950 disabled:opacity-50 text-cream-50 font-semibold text-sm px-4 py-2.5 rounded-lg transition">
            Enter console
          </button>

          <p className="text-[11px] text-slate-750/50 mt-4 leading-snug">
            <span className="font-semibold text-slate-750/70">Note:</span> this screen establishes a role,
            it does not authenticate an identity. Integration with an attested identity provider is an
            open gap (REG-002 §6.2).
          </p>
        </form>
      </div>
    </div>
  );
}
