<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarPilot Widgets — Demo</title>
  <!-- React & Babel from CDN for standalone preview -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0d12; min-height: 100vh; }
    #root { height: 100vh; }
    .demo-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; background: rgba(17, 22, 29, 0.95);
      border-bottom: 1px solid #1f2a3a; backdrop-filter: blur(8px);
    }
    .demo-header h1 { font-size: 14px; font-weight: 700; color: #e8edf2; }
    .demo-header .badges { display: flex; gap: 8px; }
    .demo-badge {
      font-size: 10px; font-weight: 600; font-family: ui-monospace, monospace;
      padding: 2px 8px; border-radius: 4px;
    }
    .badge-mock { background: rgba(255,184,0,0.15); color: #ffb800; border: 1px solid rgba(255,184,0,0.3); }
    .badge-live { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    .demo-controls { display: flex; gap: 8px; align-items: center; }
    .demo-btn {
      padding: 6px 12px; border-radius: 6px; border: 1px solid #2d3d52;
      background: #171e2a; color: #e8edf2; font-size: 12px; cursor: pointer;
      transition: all 0.15s ease;
    }
    .demo-btn:hover { background: #1c2533; border-color: #ffb800; }
    .demo-btn.primary { background: #ffb800; color: #0a0d12; border-color: #ffb800; }
    .demo-btn.primary:hover { background: #cc9500; }
    .status-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8b98a8; font-family: ui-monospace, monospace; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #5a6a7a; }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.connecting { background: #ffb800; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>ScholarPilot Widgets — Demo</h1>
    <div class="demo-controls">
      <div class="status-indicator">
        <span class="status-dot" id="mcpStatus"></span>
        <span id="mcpStatusText">Checking MCP...</span>
      </div>
      <button class="demo-btn" id="toggleModeBtn">Switch to Live MCP</button>
      <button class="demo-btn primary" id="reloadBtn">Reload Widget</button>
    </div>
  </div>

  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useMemo, createContext, useContext, useRef } = React;

    // ═══════════════════════════════════════════════════════════════════════════
    // DESIGN TOKENS (copied from widget for standalone demo)
    // ═══════════════════════════════════════════════════════════════════════════
    const DESIGN = {
      colors: {
        bg: '#0a0d12', bgElevated: '#11161d', bgHover: '#171e2a', bgActive: '#1c2533',
        border: '#1f2a3a', borderBright: '#2d3d52',
        fg: '#e8edf2', fgMuted: '#8b98a8', fgDim: '#5a6a7a',
        amber: '#ffb800', amberDim: '#cc9500', amberBg: 'rgba(255,184,0,0.12)', amberBorder: 'rgba(255,184,0,0.3)',
        green: '#22c55e', greenBg: 'rgba(34,197,94,0.12)', greenBorder: 'rgba(34,197,94,0.3)',
        red: '#ef4444', redBg: 'rgba(239,68,68,0.12)', redBorder: 'rgba(239,68,68,0.3)',
        blue: '#3b82f6', blueBg: 'rgba(59,130,246,0.12)', blueBorder: 'rgba(59,130,246,0.3)',
        phaseCore: '#3b82f6', phaseStretch: '#a855f7', phaseExport: '#14b8a6',
      },
      fonts: { sans: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif', mono: 'ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace' },
      spacing: { xs: 4, sm: 8, md: 12, lg: 16, xl: 24, xxl: 32 },
      radius: { sm: 4, md: 8, lg: 12 },
      shadows: { sm: '0 1px 2px rgba(0,0,0,0.3)', md: '0 4px 12px rgba(0,0,0,0.4)', lg: '0 8px 24px rgba(0,0,0,0.5)' },
      transitions: { fast: '120ms ease', normal: '200ms ease' },
    };

    const PHASE_GROUPS = [
      { groupId: 'intake', label: 'Intake & Search', color: DESIGN.colors.phaseCore, phases: [
        { id: 0, name: 'Prior Work Search', tools: ['search_prior_work', 'search_prior_ai_sessions'] },
        { id: 1, name: 'Paper Search & Scoring', tools: ['search_papers', 'score_paper_relevance', 'get_paper_metadata'] },
      ]},
      { groupId: 'analysis', label: 'Analysis & Synthesis', color: DESIGN.colors.phaseCore, phases: [
        { id: 2, name: 'Extraction & Claim Mining', tools: ['extract_paper_claims', 'extract_paper_metadata', 'fetch_full_text'] },
        { id: 3, name: 'Synthesis & Clustering', tools: ['cluster_papers', 'find_contradictory_claims', 'synthesize_clusters'] },
        { id: 4, name: 'Gap Finder', tools: ['assess_novelty', 'propose_gap', 'rank_gaps'] },
        { id: 5, name: 'Adversarial Review', tools: ['simulate_adversarial_review', 'run_gap_review_cycle'] },
        { id: 6, name: 'Verdict & Resilience', tools: ['compute_resilience_score', 'render_verdict'] },
      ]},
      { groupId: 'stretch', label: 'Stretch (Advanced)', color: DESIGN.colors.phaseStretch, phases: [
        { id: 7, name: 'Cross-Domain Analogist', tools: ['find_cross_domain_analogs', 'verify_technique_match'] },
        { id: 8, name: 'Tech Parameters', tools: ['extract_technical_parameters', 'compare_technical_parameters', 'fetch_and_extract_tech_params'] },
      ]},
      { groupId: 'export', label: 'Output & Persistence', color: DESIGN.colors.phaseExport, phases: [
        { id: 9, name: 'Citation Management', tools: ['generate_citation', 'export_bibtex', 'manage_bibliography'] },
        { id: 10, name: 'Writing Assistance', tools: ['check_writing', 'tone_match', 'check_ai_generic_phrasing', 'verify_meaning_preserved'] },
        { id: 11, name: 'Verification Engine', tools: ['verify_claim', 'verify_citation', 'verify_methodology_consistency', 'compile_verification_summary', 'run_all_verifications'] },
        { id: 12, name: 'Memory Persistence', tools: ['save_session', 'load_session', 'search_knowledge_graph'] },
        { id: 13, name: 'Overleaf Export (Mode 2)', tools: ['create_overleaf_project', 'push_section_to_overleaf', 'push_limitations_from_reviewer', 'add_bibliography_to_overleaf', 'sync_session_to_overleaf'] },
      ]},
    ];
    const ALL_PHASES = PHASE_GROUPS.flatMap(g => g.phases.map(p => ({ ...p, groupLabel: g.label, groupColor: g.color, groupId: g.groupId })));
    const TOOL_TO_PHASE = {}; ALL_PHASES.forEach(p => p.tools.forEach(t => { TOOL_TO_PHASE[t] = p.id; }));

    // ═══════════════════════════════════════════════════════════════════════════
    // MOCK MCP CLIENT
    // ═══════════════════════════════════════════════════════════════════════════
    function createMockMCPClient() {
      const delay = (ms) => new Promise(r => setTimeout(r, ms));
      const sessions = new Map();
      let sessionCounter = 0;
      const mockPapers = [
        { paperId: 'p1', title: 'Attention Is All You Need', authors: ['Vaswani', 'Shazeer', 'Parmar', 'Uszkoreit', 'Jones', 'Gomez', 'Kaiser', 'Polosukhin'], year: 2017, venue: 'NeurIPS', abstract: 'The dominant sequence transduction models are based on complex recurrent or convolutional neural networks in an encoder-decoder configuration...', citationCount: 186255, quartile: 'Q3', fieldsOfStudy: ['Computer Science'], pdfUrl: '', isOpenAccess: false },
        { paperId: 'p2', title: 'BERT: Pre-training of Deep Bidirectional Transformers', authors: ['Devlin', 'Chang', 'Lee', 'Toutanova'], year: 2019, venue: 'NAACL', abstract: 'We introduce a new language representation model called BERT...', citationCount: 95000, quartile: 'Q1', fieldsOfStudy: ['Computer Science'], pdfUrl: '', isOpenAccess: true },
        { paperId: 'p3', title: 'GPT-3: Language Models are Few-Shot Learners', authors: ['Brown', 'Mann', 'Ryder', 'Subbiah', 'Kaplan', 'Dhariwal', 'Neelakantan', 'Shyam', 'Sastry', 'Askell', 'Agarwal', 'Herbert-Voss', 'Krueger', 'Henighan', 'Child', 'Ramesh', 'Ziegler', 'Wu', 'Winter', 'Hesse', 'Chen', 'Sigler', 'Litwin', 'Gray', 'Chess', 'Clark', 'Bernier', 'McCandlish', 'Radford', 'Sutskever', 'Amodei'], year: 2020, venue: 'NeurIPS', abstract: 'Recent work has demonstrated substantial gains on many NLP tasks...', citationCount: 85000, quartile: 'Q1', fieldsOfStudy: ['Computer Science'], pdfUrl: '', isOpenAccess: false },
        { paperId: 'p4', title: 'Scaling Language Models: Methods, Analysis & Insights', authors: ['Hoffmann', 'Borgeaud', 'Mensch', 'Buchatskaya', 'Cai', 'Rutherford', 'Casas', 'Glasee', 'Clark', 'Dieleman', 'Hoffmann', 'Jordan', 'Keck', 'Nematzadeh', 'Ring', 'Rudolph', 'Sifre', 'Sabol', 'Wenzel', 'Wu', 'Yogatama'], year: 2022, venue: 'arXiv', abstract: 'We study the empirical scaling laws of language models...', citationCount: 12000, quartile: 'Q2', fieldsOfStudy: ['Computer Science'], pdfUrl: '', isOpenAccess: true },
        { paperId: 'p5', title: 'LLaMA: Open and Efficient Foundation Language Models', authors: ['Touvron', 'Lavril', 'Izmard', 'Martin', 'Lachaux', 'Lacroix', 'Roziere', 'Goyal', 'Hambro', 'Azhar', 'Rodriguez', 'Joulin', 'Grave', 'Lample'], year: 2023, venue: 'arXiv', abstract: 'We introduce LLaMA, a collection of foundation language models...', citationCount: 45000, quartile: 'Q2', fieldsOfStudy: ['Computer Science'], pdfUrl: '', isOpenAccess: true },
        { paperId: 'p6', title: 'FlashAttention: Fast and Memory-Efficient Exact Attention', authors: ['Dao', 'Fu', 'Ermon', 'Rudd', 'Migrated'], year: 2022, venue: 'ICML', abstract: 'We introduce FlashAttention, an IO-aware exact attention algorithm...', citationCount: 8500, quartile: 'Q1', fieldsOfStudy: ['Computer Science'], pdfUrl: '', isOpenAccess: true },
      ];

      async function callTool(name, params) {
        await delay(300 + Math.random() * 500);
        if (name === 'search_prior_work') {
          const topic = params.topic?.toLowerCase() || '';
          const filtered = mockPapers.filter(p => p.title.toLowerCase().includes(topic) || p.abstract?.toLowerCase().includes(topic) || p.authors.some(a => a.toLowerCase().includes(topic))).slice(0, params.maxPapers || 10);
          return { topic: params.topic, papers: filtered, repos: [], priorSessions: Array.from(sessions.values()).filter(s => s.topic?.toLowerCase().includes(topic)).map(s => ({ sessionId: s.sessionId, topic: s.topic, phase: s.phase, updatedAt: s.updatedAt })) };
        }
        if (name === 'search_prior_ai_sessions') { return Array.from(sessions.values()).map(s => ({ sessionId: s.sessionId, topic: s.topic, phase: s.phase, paperCount: s.papers?.length || 0, updatedAt: s.updatedAt })); }
        if (name === 'search_papers') { return { query: params.query, count: mockPapers.length, papers: mockPapers.slice(0, params.limit || 10) }; }
        if (name === 'get_paper_metadata') { const p = mockPapers.find(p => p.paperId === params.paperId); if (!p) throw new Error('Paper not found'); return p; }
        if (name === 'score_paper_relevance') { return { paperId: params.paperId, score: Math.floor(60 + Math.random() * 40), reasoning: 'Relevant to research question' }; }
        if (name === 'extract_paper_claims') { return { paperId: params.paperId, claimsCount: 3, claims: [{ claimId: `c1-${params.paperId}`, text: 'Transformer architecture eliminates recurrence', type: 'method', confidence: 85 }, { claimId: `c2-${params.paperId}`, text: 'Self-attention scales quadratically with sequence length', type: 'limitation', confidence: 92 }, { claimId: `c3-${params.paperId}`, text: 'Multi-head attention improves representation capacity', type: 'finding', confidence: 78 }] }; }
        if (name === 'extract_paper_metadata') { const p = mockPapers.find(p => p.paperId === params.paperId); return p ? { ...p, methodologies: ['Transformer', 'Attention'], datasets: ['WMT14'], limitations: ['Quadratic complexity'] } : null; }
        if (name === 'fetch_full_text') { return { paperId: params.paperId, fullText: '[Simulated full text content...]', pdfUrl: '' }; }
        if (name === 'cluster_papers') { return { sessionId: params.sessionId, clusters: [{ clusterId: 'c1', label: 'Attention Mechanisms', papers: ['p1','p2','p5'], summary: 'Core attention variants' }, { clusterId: 'c2', label: 'Efficiency Optimizations', papers: ['p4','p6'], summary: 'FlashAttention, scaling laws' }, { clusterId: 'c3', label: 'Foundation Models', papers: ['p3'], summary: 'Large-scale pre-training' }] }; }
        if (name === 'find_contradictory_claims') { return { sessionId: params.sessionId, contradictions: [{ claimA: 'c1-p1', claimB: 'c2-p1', description: 'Attention eliminates recurrence but introduces quadratic bottleneck', severity: 'medium' }] }; }
        if (name === 'synthesize_clusters') { return { sessionId: params.sessionId, syntheses: [{ clusterId: 'c1', narrative: 'Attention mechanisms have evolved from additive to scaled dot-product to multi-head variants, each improving parallelization and representational capacity.' }, { clusterId: 'c2', narrative: 'Efficiency research focuses on reducing the O(n²) complexity through sparse attention, flash attention, and linear approximations.' }], overallNarrative: 'The field centers on the tension between attention expressivity and computational efficiency.' }; }
        if (name === 'assess_novelty') { return { noveltyScore: Math.floor(60 + Math.random() * 35), similarClaims: [] }; }
        if (name === 'propose_gap') { return { gap: { claim: 'Linear attention with exact equivalence to softmax for sequences >100k tokens', noveltyScore: 85, feasibility: 70, impact: 90 }, noveltyResult: { noveltyScore: 80, similarClaims: [] } }; }
        if (name === 'rank_gaps') { return { rankedGaps: [{ claim: 'Linear attention with exact equivalence', rank: 1, score: 0.82 }, { claim: 'Hardware-aware attention kernels', rank: 2, score: 0.78 }, { claim: 'Dynamic sparse attention patterns', rank: 3, score: 0.74 }] }; }
        if (name === 'simulate_adversarial_review') { return { gapId: params.gapId, iteration: 1, verdict: Math.random() > 0.3 ? 'PASS' : 'OBJECTION', objections: ['Scalability claims need empirical validation', 'Comparison to FlashAttention-2 missing', 'Memory analysis incomplete'], objectionStrength: Math.floor(40 + Math.random() * 50), confidence: Math.floor(60 + Math.random() * 30) }; }
        if (name === 'run_gap_review_cycle') { const it = Math.min(params.maxRetries || 3, 3); const reviews = []; for (let i = 0; i < it; i++) reviews.push({ iteration: i+1, verdict: i === it-1 ? 'PASS' : 'OBJECTION', objections: ['Validation needed', 'Baselines incomplete'] }); return { topic: params.topic, gap: { claim: 'Final refined gap claim', noveltyScore: 82 }, reviews, passed: true }; }
        if (name === 'compute_resilience_score') { return { gapId: params.gapId, resilienceScore: Math.floor(60 + Math.random() * 30), breakdown: { objectionStrength: 45, recencyPenalty: 5, citationDensity: 8 } }; }
        if (name === 'render_verdict') { const s = Math.floor(60 + Math.random() * 30); return { gapId: params.gapId, finalVerdict: s >= 75 ? 'PASS' : s >= 55 ? 'CONDITIONAL' : 'REJECT', resilienceScore: s, reasoning: 'Moderate resilience. Objections addressable with additional experiments.' }; }
        if (name === 'generate_citation') { return { citation: '[1] Vaswani et al., "Attention Is All You Need", NeurIPS 2017.', style: params.style }; }
        if (name === 'export_bibtex') { return { bibtex: '@article{vaswani2017attention,\n  title={Attention is all you need},\n  author={Vaswani, Ashish and others},\n  journal={NeurIPS},\n  year={2017}\n}' }; }
        if (name === 'manage_bibliography') { return { action: params.action, paperIds: params.paperIds, success: true }; }
        if (name === 'check_writing') { return { section: params.section, tone: { score: 78, feedback: 'Good academic tone, minor hedging detected' }, aiGeneric: { flags: ['In this paper, we explore...'], score: 65 }, clarity: { score: 82, suggestions: ['Define "attention mechanism" on first use'] } }; }
        if (name === 'verify_claim') { return { claimId: params.claimId, verified: true, confidence: 88, evidence: ['Extracted from paper abstract', 'Consistent with methodology section'] }; }
        if (name === 'verify_citation') { return { paperId: params.paperId, accurate: true, issues: [] }; }
        if (name === 'run_all_verifications') { return { sessionId: params.sessionId, summary: { total: 12, passed: 10, failed: 2, warnings: 1 } }; }
        if (name === 'save_session') { const id = params.sessionId || `sess_${++sessionCounter}`; sessions.set(id, { ...params, sessionId: id, updatedAt: new Date().toISOString() }); return { sessionId: id, saved: true }; }
        if (name === 'load_session') { return sessions.get(params.sessionId) || { error: 'Not found' }; }
        if (name === 'search_knowledge_graph') { return { entities: ['Transformer', 'Attention', 'BERT'], relations: [] }; }
        if (name === 'create_overleaf_project') { const pid = `proj_${Date.now()}`; return { projectId: pid, projectPath: `/tmp/${pid}`, title: params.title, authors: params.authors, template: params.template, sectionsInitialized: 0 }; }
        if (name === 'push_section_to_overleaf') { return { section: params.section, pushed: true, contentLength: params.content?.length || 0 }; }
        if (name === 'push_limitations_from_reviewer') { return { objectionsCount: params.objections?.length || 0, pushed: true }; }
        if (name === 'add_bibliography_to_overleaf') { return { entriesAdded: (params.bibtex?.match(/@/g) || []).length, pushed: true }; }
        if (name === 'sync_session_to_overleaf') { return { sessionId: params.sessionId, projectCreated: true, sectionsSynced: 9, hasBibliography: true, hasLimitations: true }; }
        if (name === 'export_overleaf_zip') { throw new Error('Tool disabled: archiver ESM/CJS incompatibility'); }
        return { error: `Unknown tool: ${name}`, mock: true };
      }
      return { callTool };
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // LIVE MCP CLIENT (POSTs to http://localhost:3000/mcp)
    // ═══════════════════════════════════════════════════════════════════════════
    function createLiveMCPClient(sessionId) {
      let currentSessionId = sessionId;
      async function callTool(name, params) {
        const payload = { jsonrpc: '2.0', id: Date.now(), method: 'tools/call', params: { name, arguments: params } };
        const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' };
        if (currentSessionId) headers['Mcp-Session-Id'] = currentSessionId;
        const res = await fetch('http://localhost:3000/mcp', { method: 'POST', headers, body: JSON.stringify(payload) });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        // Parse SSE response
        const lines = text.trim().split('\n');
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = JSON.parse(line.slice(6));
            if (data.result?.content?.[0]?.text) {
              try { return JSON.parse(data.result.content[0].text); } catch { return data.result.content[0].text; }
            }
            if (data.error) throw new Error(data.error.message);
          }
        }
        throw new Error('No valid response from MCP');
      }
      return { callTool, setSessionId: (id) => { currentSessionId = id; } };
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // SHARED UI PRIMITIVES
    // ═══════════════════════════════════════════════════════════════════════════
    const Mono = ({ children, style, ...props }) => <code style={{ fontFamily: DESIGN.fonts.mono, fontSize: 11, ...style }} {...props}>{children}</code>;
    const Badge = ({ children, variant = 'default', style, ...props }) => {
      const variants = {
        default: { bg: DESIGN.colors.bgHover, color: DESIGN.colors.fgMuted, border: DESIGN.colors.border },
        amber: { bg: DESIGN.colors.amberBg, color: DESIGN.colors.amber, border: DESIGN.colors.amberBorder },
        green: { bg: DESIGN.colors.greenBg, color: DESIGN.colors.green, border: DESIGN.colors.greenBorder },
        red: { bg: DESIGN.colors.redBg, color: DESIGN.colors.red, border: DESIGN.colors.redBorder },
        blue: { bg: DESIGN.colors.blueBg, color: DESIGN.colors.blue, border: DESIGN.colors.blueBorder },
        phaseCore: { bg: 'rgba(59,130,246,0.15)', color: DESIGN.colors.phaseCore, border: 'rgba(59,130,246,0.3)' },
        phaseStretch: { bg: 'rgba(168,85,247,0.15)', color: DESIGN.colors.phaseStretch, border: 'rgba(168,85,247,0.3)' },
        phaseExport: { bg: 'rgba(20,184,166,0.15)', color: DESIGN.colors.phaseExport, border: 'rgba(20,184,166,0.3)' },
      };
      const v = variants[variant] || variants.default;
      return <span style={{ display: 'inline-flex', alignItems: 'center', padding: '2px 8px', fontSize: 10, fontWeight: 600, fontFamily: DESIGN.fonts.mono, borderRadius: DESIGN.radius.sm, backgroundColor: v.bg, color: v.color, border: `1px solid ${v.border}`, ...style }} {...props}>{children}</span>;
    };
    const Button = ({ children, variant = 'secondary', onClick, disabled, style, ...props }) => {
      const variants = { primary: { bg: DESIGN.colors.amber, color: DESIGN.colors.bg, border: 'none', hover: DESIGN.colors.amberDim }, secondary: { bg: DESIGN.colors.bgHover, color: DESIGN.colors.fg, border: DESIGN.colors.border, hover: DESIGN.colors.bgActive }, ghost: { bg: 'transparent', color: DESIGN.colors.fgMuted, border: 'none', hover: DESIGN.colors.bgHover }, danger: { bg: DESIGN.colors.redBg, color: DESIGN.colors.red, border: DESIGN.colors.redBorder, hover: DESIGN.colors.red } };
      const v = variants[variant] || variants.secondary;
      const [hovered, setHovered] = useState(false);
      return <button onClick={onClick} disabled={disabled} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: DESIGN.spacing.xs, padding: `${DESIGN.spacing.xs}px ${DESIGN.spacing.md}px`, fontSize: 12, fontWeight: 600, fontFamily: DESIGN.fonts.sans, borderRadius: DESIGN.radius.md, backgroundColor: disabled ? DESIGN.colors.bgHover : (hovered ? v.hover : v.bg), color: disabled ? DESIGN.colors.fgDim : v.color, border: `1px solid ${disabled ? DESIGN.colors.border : v.border}`, cursor: disabled ? 'not-allowed' : 'pointer', transition: `background-color ${DESIGN.transitions.fast}, border-color ${DESIGN.transitions.fast}, color ${DESIGN.transitions.fast}`, opacity: disabled ? 0.5 : 1, ...style }} {...props}>{children}</button>;
    };
    const Input = ({ value, onChange, placeholder, style, ...props }) => <input value={value} onChange={onChange} placeholder={placeholder} style={{ width: '100%', padding: `${DESIGN.spacing.xs}px ${DESIGN.spacing.md}px`, fontSize: 13, fontFamily: DESIGN.fonts.sans, backgroundColor: DESIGN.colors.bg, color: DESIGN.colors.fg, border: `1px solid ${DESIGN.colors.border}`, borderRadius: DESIGN.radius.md, outline: 'none', boxSizing: 'border-box', ...style }} onFocus={e => e.target.style.borderColor = DESIGN.colors.amber} onBlur={e => e.target.style.borderColor = DESIGN.colors.border} {...props} />;
    const Card = ({ children, style, ...props }) => <div style={{ backgroundColor: DESIGN.colors.bgElevated, border: `1px solid ${DESIGN.colors.border}`, borderRadius: DESIGN.radius.lg, padding: DESIGN.spacing.lg, ...style }} {...props}>{children}</div>;
    const Panel = ({ children, style, ...props }) => <div style={{ backgroundColor: DESIGN.colors.bgElevated, border: `1px solid ${DESIGN.colors.border}`, borderRadius: DESIGN.radius.lg, ...style }} {...props}>{children}</div>;
    const ScrollArea = ({ children, style, ...props }) => <div style={{ overflow: 'auto', ...style }} {...props}>{children}</div>;
    const Divider = ({ style, ...props }) => <hr style={{ border: 'none', borderTop: `1px solid ${DESIGN.colors.border}`, margin: `${DESIGN.spacing.md}px 0`, ...style }} {...props} />;

    function ChatHistorySidebar({ mcpClient, selectedSessionId, onSessionSelect, onNewSession, style }) {

r' && <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 2 }}><Badge variant={score >= 80 ? 'green' : score >= 60 ? 'amber' : 'red'} style={{ fontSize: 10, fontWeight: 700 }}>{score}%</Badge><Mono style={{ color: DESIGN.colors.fgDim }}>relevance</Mono></div>}</div>{paper.abstract && <div style={{ fontSize: 12, color: DESIGN.colors.fgMuted, lineHeight: 1.5, display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{paper.abstract}</div>}{paper.authors && paper.authors.length > 0 && <div style={{ fontSize: 11, color: DESIGN.colors.fgDim, display: 'flex', flexWrap: 'wrap', gap: DESIGN.spacing.xs }}>{paper.authors.slice(0, 3).map((a, i) => <span key={i} style={{ fontFamily: DESIGN.fonts.mono }}>{a}{i < paper.authors.length - 1 && i < 2 ? ',' : ''}</span>)}{paper.authors.length > 3 && <span style={{ fontFamily: DESIGN.fonts.mono }}>+{paper.authors.length - 3} more</span>}</div>}; }
    function ResultsList({ papers, selectedPaperId, onSelectPaper, loading }) { if (loading) return <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: DESIGN.spacing.xxl, color: DESIGN.colors.fgDim }}>Searching...</div>; if (!papers || papers.length === 0) return <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: DESIGN.spacing.xxl, color: DESIGN.colors.fgDim, textAlign: 'center' }}>No results found. Try a different query or phase.</div>; return <ScrollArea style={{ flex: 1, padding: '0 4px' }}><div style={{ display: 'flex', flexDirection: 'column', gap: DESIGN.spacing.sm }}>{papers.slice(0, 20).map(paper => <ResultCard key={paper.paperId} paper={paper} selected={paper.paperId === selectedPaperId} onSelect={onSelectPaper} />)}</div></ScrollArea>; }
    function PhaseSearchBar({ mcpClient, selectedPhase = 1, onPhaseChange, selectedPaperId, onPaperSelect, style }) {

    // ═══════════════════════════════════════════════════════════════════════════
    // 3. OVERLEAF FLOW BUTTON
    // ═══════════════════════════════════════════════════════════════════════════
    const OVERLEAF_STEPS = [ { id: 'create', label: 'Create Project', tool: 'create_overleaf_project', description: 'Initialize IEEE template repo' }, { id: 'sections', label: 'Push Sections', tool: 'push_section_to_overleaf', description: 'Write all 9 section files', multi: true }, { id: 'limitations', label: 'Push Limitations', tool: 'push_limitations_from_reviewer', description: 'Auto-generate from review objections' }, { id: 'bibliography', label: 'Add Bibliography', tool: 'add_bibliography_to_overleaf', description: 'Write BibTeX to references.bib' }, { id: 'sync', label: 'Final Sync', tool: 'sync_session_to_overleaf', description: 'Commit & push all changes' }, ];
    function StepBadge({ step, status }) { const variants = { pending: { bg: DESIGN.colors.bgHover, color: DESIGN.colors.fgDim, border: DESIGN.colors.border }, running: { bg: DESIGN.colors.blueBg, color: DESIGN.colors.blue, border: DESIGN.colors.blueBorder }, done: { bg: DESIGN.colors.greenBg, color: DESIGN.colors.green, border: DESIGN.colors.greenBorder }, error: { bg: DESIGN.colors.redBg, color: DESIGN.colors.red, border: DESIGN.colors.redBorder }, }; const v = variants[status] || variants.pending; return <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, flex: 1, minWidth: 0 }}><div style={{ width: 32, height: 32, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', backgroundColor: v.bg, border: `2px solid ${v.border}`, color: v.color, fontSize: 12, fontWeight: 700, fontFamily: DESIGN.fonts.mono, transition: `all ${DESIGN.transitions.normal}` }}>{status === 'pending' && '○'}{status === 'running' && <svg width="16" height="16" viewBox="0 0 24 24" style={{ animation: 'spin 1s linear infinite' }}><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" fill="none" strokeDasharray="31.4 31.4" strokeLinecap="round" /></svg>}{status === 'done' && '✓'}{status === 'error' && '✗'}</div><Mono style={{ fontSize: 9, color: DESIGN.colors.fgDim, textAlign: 'center', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: 80 }}>{step.label}</Mono></div>; }
    function StatusPopover({ steps, open, onClose }) { if (!open) return null; return <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', backgroundColor: 'rgba(0,0,0,0.5)' }} onClick={onClose}><div style={{ backgroundColor: DESIGN.colors.bgElevated, border: `1px solid ${DESIGN.colors.borderBright}`, borderRadius: DESIGN.radius.lg, padding: DESIGN.spacing.lg, minWidth: 380, maxWidth: 480, maxHeight: '80vh', overflow: 'auto', boxShadow: DESIGN.shadows.lg }} onClick={e => e.stopPropagation()}><div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: DESIGN.spacing.lg }}><div style={{ fontWeight: 600, fontSize: 14, color: DESIGN.colors.fg }}>Overleaf Export Pipeline</div><Button variant="ghost" onClick={onClose}>✕</Button></div><div style={{ display: 'flex', flexDirection: 'column', gap: DESIGN.spacing.md }}>{OVERLEAF_STEPS.map((step, i) => <div key={step.id} style={{ display: 'flex', alignItems: 'center', gap: DESIGN.spacing.md, padding: DESIGN.spacing.sm, backgroundColor: DESIGN.colors.bg, borderRadius: DESIGN.radius.md }}><StepBadge step={step} status={steps[step.id]?.status || 'pending'} /><div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 12, fontWeight: 500, color: DESIGN.colors.fg }}>{step.label}</div><div style={{ fontSize: 11, color: DESIGN.colors.fgDim, marginTop: 2, fontFamily: DESIGN.fonts.mono }}>{step.tool}</div><div style={{ fontSize: 11, color: DESIGN.colors.fgMuted, marginTop: 2 }}>{step.description}</div>{steps[step.id]?.error && <div style={{ fontSize: 11, color: DESIGN.colors.red, marginTop: 4, fontFamily: DESIGN.fonts.mono }}>Error: {steps[step.id].error}</div>}{steps[step.id]?.result && <div style={{ fontSize: 10, color: DESIGN.colors.green, marginTop: 4, fontFamily: DESIGN.fonts.mono }}>{JSON.stringify(steps[step.id].result).slice(0, 120)}...</div>}</div></div>)}</div>{steps.sync?.status === 'done' && <div style={{ marginTop: DESIGN.spacing.lg, padding: DESIGN.spacing.md, backgroundColor: DESIGN.colors.greenBg, border: `1px solid ${DESIGN.colors.greenBorder}`, borderRadius: DESIGN.radius.md, color: DESIGN.colors.green, fontSize: 12 }}>✓ Export complete! Project pushed to Overleaf Git remote.</div>}{steps.sync?.status === 'error' && <div style={{ marginTop: DESIGN.spacing.lg, padding: DESIGN.spacing.md, backgroundColor: DESIGN.colors.redBg, border: `1px solid ${DESIGN.colors.redBorder}`, borderRadius: DESIGN.radius.md, color: DESIGN.colors.red, fontSize: 12 }}>✗ Export failed: {steps.sync.error}</div>}</div></div>; }
    function OverleafFlowButton({ mcpClient, sessionId, paperTitle = 'Research Paper', paperAuthors = ['Author'], paperTemplate = 'ieee', reviewObjections = [], bibliographyBibtex = '', sections = {}, style }) {
      const [running, setRunning] = useState(false); const [steps, setSteps] = useState({}); const [popoverOpen, setPopoverOpen] = useState(false); const buttonRef = useRef(null);
      const resetSteps = useCallback(() => { setSteps(OVERLEAF_STEPS.reduce((acc, s) => ({ ...acc, [s.id]: { status: 'pending' }}), {})); }, []);
      useEffect(() => { resetSteps(); }, [resetSteps]);
      const executePipeline = useCallback(async () => { if (running || !sessionId) return; setRunning(true); setPopoverOpen(true); resetSteps(); const updateStep = (id, status, data = {}) => { setSteps(prev => ({ ...prev, [id]: { ...prev[id], status, ...data } })); }; try { updateStep('create', 'running'); const project = await mcpClient.callTool('create_overleaf_project', { title: paperTitle, authors: paperAuthors, template: paperTemplate, sessionId }); updateStep('create', 'done', { result: project }); updateStep('sections', 'running'); const sectionOrder = ['abstract', 'introduction', 'related-work', 'methodology', 'experiments', 'results', 'discussion', 'limitations', 'conclusion']; for (const section of sectionOrder) { if (sections[section]) { await mcpClient.callTool('push_section_to_overleaf', { section, content: sections[section], sessionId }); } } updateStep('sections', 'done'); if (reviewObjections.length > 0) { updateStep('limitations', 'running'); await mcpClient.callTool('push_limitations_from_reviewer', { objections: reviewObjections, sessionId }); updateStep('limitations', 'done'); } else { updateStep('limitations', 'done', { result: { skipped: true, reason: 'No objections provided' } }); } if (bibliographyBibtex) { updateStep('bibliography', 'running'); await mcpClient.callTool('add_bibliography_to_overleaf', { bibtex: bibliographyBibtex, sessionId }); updateStep('bibliography', 'done'); } else { updateStep('bibliography', 'done', { result: { skipped: true, reason: 'No bibliography provided' } }); } updateStep('sync', 'running'); const syncResult = await mcpClient.callTool('sync_session_to_overleaf', { sessionId, createIfMissing: false }); updateStep('sync', 'done', { result: syncResult }); } catch (error) { console.error('Overleaf pipeline error:', error); const stepIds = OVERLEAF_STEPS.map(s => s.id); for (const id of stepIds) { if (steps[id]?.status === 'running' || steps[id]?.status === 'pending') { updateStep(id, 'error', { error: error.message || String(error) }); break; } } } finally { setRunning(false); } }, [running, sessionId, mcpClient, paperTitle, paperAuthors, paperTemplate, reviewObjections, bibliographyBibtex, sections, steps, resetSteps]);
      const overallStatus = useMemo(() => { if (running) return 'running'; const statuses = OVERLEAF_STEPS.map(s => steps[s.id]?.status || 'pending'); if (statuses.every(s => s === 'done')) return 'done'; if (statuses.some(s => s === 'error')) return 'error'; if (statuses.some(s => s === 'running')) return 'running'; return 'pending'; }, [running, steps]);
      return <div style={{ position: 'relative', ...style }}><Button ref={buttonRef} variant={overallStatus === 'done' ? 'primary' : overallStatus === 'error' ? 'danger' : 'secondary'} onClick={executePipeline} disabled={running || !sessionId} style={{ minWidth: 180, padding: `${DESIGN.spacing.sm}px ${DESIGN.spacing.lg}px`, backgroundColor: overallStatus === 'done' ? DESIGN.colors.green : overallStatus === 'error' ? DESIGN.colors.redBg : DESIGN.colors.amber, color: overallStatus === 'done' ? DESIGN.colors.bg : overallStatus === 'error' ? DESIGN.colors.red : DESIGN.colors.bg, borderColor: overallStatus === 'done' ? DESIGN.colors.green : overallStatus === 'error' ? DESIGN.colors.redBorder : DESIGN.colors.amber }}><span style={{ display: 'flex', alignItems: 'center', gap: DESIGN.spacing.xs }}>{overallStatus === 'running' && <svg width="14" height="14" viewBox="0 0 24 24" style={{ animation: 'spin 1s linear infinite' }}><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" fill="none" strokeDasharray="31.4 31.4" strokeLinecap="round" /></svg>}{overallStatus === 'done' && '✓'}{overallStatus === 'error' && '✗'}{overallStatus === 'pending' && '□'}<span>Export to Overleaf</span></span></Button><StatusPopover steps={steps} open={popoverOpen} onClose={() => setPopoverOpen(false)} /><style jsx>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style></div>; }

    // ═══════════════════════════════════════════════════════════════════════════
    // 4. RESEARCH PILOT SHELL (Composed Layout)
    // ═══════════════════════════════════════════════════════════════════════════
    function ResearchPilotShell({ mcpClient, initialSessionId, style }) {
      const [selectedSessionId, setSelectedSessionId] = useState(initialSessionId);
      const [selectedPhase, setSelectedPhase] = useState(1);
      const [selectedPaperId, setSelectedPaperId] = useState(null);
      const [showOverleaf, setShowOverleaf] = useState(false);
      const [sessionData, setSessionData] = useState({});

      const handleNewSession = useCallback(async () => { const result = await mcpClient.callTool('save_session', { topic: 'New Research Session', phase: 0, papers: [] }); if (result.sessionId) { setSelectedSessionId(result.sessionId); setSessionData({ topic: 'New Research Session', phase: 0, papers: [] }); } }, [mcpClient]);
      const handleSessionSelect = useCallback(async (session) => { setSelectedSessionId(session.sessionId); const loaded = await mcpClient.callTool('load_session', { sessionId: session.sessionId }); setSessionData(loaded); setSelectedPhase(loaded.phase || 0); }, [mcpClient]);
      const overleafConfig = useMemo(() => ({ sessionId: selectedSessionId, paperTitle: sessionData.topic || 'Research Paper', paperAuthors: sessionData.authors || ['Author'], paperTemplate: sessionData.template || 'ieee', reviewObjections: sessionData.reviewObjections || [], bibliographyBibtex: sessionData.bibtex || '', sections: sessionData.sections || {}, }), [selectedSessionId, sessionData]);

      return <div style={{ display: 'flex', height: '100vh', backgroundColor: DESIGN.colors.bg, color: DESIGN.colors.fg, fontFamily: DESIGN.fonts.sans, fontSize: 13, lineHeight: 1.5, ...style }}><ChatHistorySidebar mcpClient={mcpClient} selectedSessionId={selectedSessionId} onSessionSelect={handleSessionSelect} onNewSession={handleNewSession} /><div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}><div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: `${DESIGN.spacing.md}px ${DESIGN.spacing.lg}px`, borderBottom: `1px solid ${DESIGN.colors.border}`, backgroundColor: DESIGN.colors.bgElevated }}><div style={{ display: 'flex', alignItems: 'center', gap: DESIGN.spacing.md }}><span style={{ fontWeight: 700, fontSize: 16, color: DESIGN.colors.fg }}>ScholarPilot</span>{selectedSessionId && <Badge variant="amber" style={{ fontSize: 10 }}>{selectedSessionId.slice(0, 12)}</Badge>}</div><div style={{ display: 'flex', alignItems: 'center', gap: DESIGN.spacing.sm }}><Button variant="ghost" onClick={() => setShowOverleaf(!showOverleaf)}>{showOverleaf ? 'Hide' : 'Show'} Overleaf</Button></div></div><div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}><PhaseSearchBar mcpClient={mcpClient} selectedPhase={selectedPhase} onPhaseChange={setSelectedPhase} selectedPaperId={selectedPaperId} onPaperSelect={setSelectedPaperId} /></div></div>{showOverleaf && <div style={{ width: 340, borderLeft: `1px solid ${DESIGN.colors.border}`, backgroundColor: DESIGN.colors.bg, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: DESIGN.spacing.xl }}><OverleafFlowButton mcpClient={mcpClient} {...overleafConfig} /><div style={{ marginTop: DESIGN.spacing.lg, textAlign: 'center', color: DESIGN.colors.fgDim, fontSize: 11, fontFamily: DESIGN.fonts.mono, maxWidth: 280 }}>Decoupled Phase 13 pipeline. Runs create → push sections → limitations → bibliography → sync independently of main search phase.</div></div>}</div>; }

    // ═══════════════════════════════════════════════════════════════════════════
    // DEMO APP — with Mock/Live toggle
    // ═══════════════════════════════════════════════════════════════════════════
    function DemoApp() {
      const [useLive, setUseLive] = useState(false);
      const [mcpStatus, setMcpStatus] = useState('unknown'); // unknown, connected, error
      const [liveClient, setLiveClient] = useState(null);
      const [key, setKey] = useState(0);

      // Check MCP server on load + when toggling
      useEffect(() => { checkMcp(); }, [useLive]);
      const checkMcp = async () => { try { const res = await fetch('http://localhost:3000/mcp', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: 'demo', version: '1.0' } } }) }); if (res.ok) { setMcpStatus('connected'); const sessionId = res.headers.get('mcp-session-id'); if (sessionId) { const client = createLiveMCPClient(sessionId); setLiveClient(client); return; } } throw new Error('MCP init failed'); } catch (e) { console.warn('MCP not available:', e.message); setMcpStatus('error'); setLiveClient(null); } };

      const toggleMode = () => { setUseLive(prev => !prev); setKey(k => k + 1); };

      const currentClient = useLive ? liveClient : createMockMCPClient();
      if (useLive && !liveClient && mcpStatus !== 'connected') { return <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', backgroundColor: DESIGN.colors.bg, color: DESIGN.colors.fg, fontFamily: DESIGN.fonts.sans, padding: DESIGN.spacing.xl, textAlign: 'center' }}><div><div style={{ fontSize: 18, marginBottom: 12 }}>Connecting to MCP server...</div><div style={{ color: DESIGN.colors.fgDim }}>http://localhost:3000/mcp</div></div></div>; }

      return <><div style={{ position: 'fixed', bottom: 16, right: 16, zIndex: 99, display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-end' }}><div style={{ background: DESIGN.colors.bgElevated, border: `1px solid ${DESIGN.colors.border}`, borderRadius: DESIGN.radius.md, padding: DESIGN.spacing.md, minWidth: 220 }}><div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}><span className={`status-dot ${mcpStatus === 'connected' ? 'connected' : mcpStatus === 'error' ? '' : 'connecting'}`}></span><span style={{ fontSize: 12, color: DESIGN.colors.fg }}>MCP Server: <span style={{ color: mcpStatus === 'connected' ? DESIGN.colors.green : mcpStatus === 'error' ? DESIGN.colors.red : DESIGN.colors.amber }}>{mcpStatus === 'connected' ? 'Connected' : mcpStatus === 'error' ? 'Unavailable (using Mock)' : 'Checking...'}</span></span></div><div style={{ fontSize: 11, color: DESIGN.colors.fgDim, fontFamily: DESIGN.fonts.mono }}>Mode: {useLive ? 'Live MCP' : 'Mock Client'}</div></div></div><ResearchPilotShell key={key} mcpClient={currentClient} initialSessionId="sess_1" /></>;
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DemoApp />);
  </script>

  <script>
    // Update header status indicator from React state
    const observer = new MutationObserver(() => {
      const dot = document.getElementById('mcpStatus');
      const text = document.getElementById('mcpStatusText');
      const btn = document.getElementById('toggleModeBtn');
      const statusEl = document.querySelector('.status-indicator .status-dot');
      if (statusEl) {
        const connected = statusEl.classList.contains('connected');
        const connecting = statusEl.classList.contains('connecting');
        dot.className = 'status-dot' + (connected ? ' connected' : connecting ? ' connecting' : '');
        text.textContent = connected ? 'MCP Connected' : connecting ? 'Connecting...' : 'Mock Mode';
        btn.textContent = connected ? 'Switch to Mock' : 'Switch to Live MCP';
      }
    });
    observer.observe(document.body, { subtree: true, childList: true, attributes: true });

    document.getElementById('toggleModeBtn')?.addEventListener('click', () => {
      window.postMessage({ type: 'TOGGLE_MCP_MODE' }, '*');
    });
    document.getElementById('reloadBtn')?.addEventListener('click', () => {
      window.postMessage({ type: 'RELOAD_WIDGET' }, '*');
    });
    window.addEventListener('message', (e) => {
      if (e.data.type === 'TOGGLE_MCP_MODE' || e.data.type === 'RELOAD_WIDGET') {
        // Trigger React re-render via Babel's internal mechanism
        const rootEl = document.getElementById('root');
        if (rootEl.__reactRoot) {
          // Force remount by clearing and re-rendering
          rootEl.innerHTML = '';
          location.reload();
        } else {
          location.reload();
        }
      }
    });
  </script>
</body>
</html>
