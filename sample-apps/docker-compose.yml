version: "3.9"

services:
  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./quantumsolve.db
      - ORCHESTRATOR_MODE=mcp
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./backend/backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
