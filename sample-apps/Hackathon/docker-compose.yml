version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j_graphrag
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/helixpassword
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_graphrag
    ports:
      - "6333:6333"
    restart: unless-stopped
